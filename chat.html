<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Chat & Profils</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/core/config.js"></script>

<style>
body {
  margin:0;
  font-family:Arial;
  background: linear-gradient(-45deg, #ff4d6d, #7b2ff7, #00c6ff);
  background-size: 400% 400%;
  animation: bg 12s ease infinite;
  color:white;
}

@keyframes bg {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* NAV */
nav {
  display:flex;
  justify-content:space-between;
  padding:15px;
  background:rgba(0,0,0,0.25);
  backdrop-filter: blur(10px);
}

nav a {
  color:white;
  margin-right:10px;
  text-decoration:none;
  opacity:0.8;
}
nav a:hover { opacity:1; }

/* LAYOUT */
.layout {
  display:flex;
  height:calc(100vh - 60px);
}

/* LEFT USERS (WHATSAPP STYLE) */
.users {
  width:320px;
  border-right:1px solid rgba(255,255,255,0.1);
  overflow-y:auto;
  background:rgba(0,0,0,0.2);
}

.user {
  padding:12px;
  cursor:pointer;
  display:flex;
  gap:10px;
  align-items:center;
  border-bottom:1px solid rgba(255,255,255,0.05);
}

.user:hover {
  background:rgba(255,255,255,0.08);
}

.user.active {
  background:rgba(255,77,109,0.2);
  border-left:3px solid #ff4d6d;
}

.user img {
  width:45px;
  height:45px;
  border-radius:50%;
  object-fit:cover;
}

.user small {
  opacity:0.7;
  font-size:12px;
}

.badge {
  background:red;
  color:white;
  font-size:11px;
  padding:3px 7px;
  border-radius:20px;
  margin-left:auto;
}

/* CHAT */
.chat {
  flex:1;
  display:flex;
  flex-direction:column;
}

.chat-header {
  padding:10px;
  background:rgba(0,0,0,0.25);
  font-weight:bold;
}

.messages {
  flex:1;
  overflow-y:auto;
  padding:10px;
}

.msg {
  padding:8px;
  margin:5px;
  border-radius:10px;
  max-width:60%;
}

.me {
  background:#ff4d6d;
  margin-left:auto;
}

.them {
  background:#333;
}

/* INPUT */
.input {
  display:flex;
  padding:10px;
  border-top:1px solid rgba(255,255,255,0.1);
  background:rgba(0,0,0,0.2);
}

.input input {
  flex:1;
  padding:10px;
  border:none;
  border-radius:8px;
}

.input button {
  padding:10px;
  margin-left:5px;
}
.header {
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;

  gap: 12px;
  padding: 15px;

  background: rgba(0,0,0,0.2);
  backdrop-filter: blur(12px);
}

.header a {
  color: white;
  text-decoration: none;
  padding: 8px 12px;
  border-radius: 10px;
  transition: 0.2s;
}

.header a:hover {
  background: rgba(255,255,255,0.2);
}
</style>
</head>

<body>

<!-- NAV -->
<nav class="header">
  <div class="nav-left">
    <a href="index.html">🏠 Accueil</a>
    <a href="profile.html">👤 Profil</a>
    <a href="pageDesProfils.html">🔍 Recherche</a>
    <a href="signup.html">👤 Inscription</a>
  </div>
</nav>

<div class="layout">

  <!-- USERS LIST -->
  <div class="users" id="users"></div>

  <!-- CHAT -->
  <div class="chat">

    <div class="chat-header" id="chatHeader">
      💬 Sélectionne une conversation
    </div>

    <div class="messages" id="messages"></div>

    <div id="typing" style="padding:5px;font-size:12px;opacity:0.6;"></div>
<div class="input">
  <input id="input" placeholder="Message...">
  <button onclick="toggleEmoji()">😄</button>
  <button onclick="startRecording()">🎤</button>
  <button onclick="send()">➤</button>
  <div id="emojiPanel" style="
  display:none;
  position:fixed;
  bottom:80px;
  left:20px;
  background:#1a1a1a;
  padding:10px;
  border-radius:12px;
  box-shadow:0 0 20px rgba(0,0,0,0.4);
  font-size:22px;
">
  <span onclick="addEmoji('😀')">😀</span>
  <span onclick="addEmoji('😂')">😂</span>
  <span onclick="addEmoji('😍')">😍</span>
  <span onclick="addEmoji('🔥')">🔥</span>
  <span onclick="addEmoji('❤️')">❤️</span>
  <span onclick="addEmoji('👍')">👍</span>
  <span onclick="addEmoji('😎')">😎</span>
</div>
</div>

  </div>

</div>

<script>

const state = {
  user: null,
  current: null
};
let mediaRecorder;
let audioChunks = [];

async function startRecording() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

    mediaRecorder = new MediaRecorder(stream);
    audioChunks = [];

    mediaRecorder.ondataavailable = (e) => {
      audioChunks.push(e.data);
    };

    mediaRecorder.onstop = async () => {

      const audioBlob = new Blob(audioChunks, { type: "audio/webm" });

      const reader = new FileReader();

      reader.onloadend = async () => {

        const base64 = reader.result;

        const { error } = await supabaseClient.from("messages").insert({
          sender_id: state.user.id,
          receiver_id: state.current.user_id,
          audio: base64,
          content: null,
          is_read: false
        });

        if (error) console.error(error);

        loadMessages();
      };

      reader.readAsDataURL(audioBlob);
    };

    mediaRecorder.start();

    // STOP après 5 sec
    setTimeout(() => {
      mediaRecorder.stop();
      stream.getTracks().forEach(t => t.stop());
    }, 5000);

  } catch (err) {
    console.error("Micro error:", err);
    alert("Micro refusé ou non disponible");
  }
}

/* INIT */
document.addEventListener("DOMContentLoaded", async () => {

  const { data } = await supabaseClient.auth.getUser();
  if (!data?.user) return location.href = "login.html";

  state.user = data.user;

  const ok = await checkPremium();
  if (!ok) return;

  loadUsers();
  listenMessages();
  listenTyping();
});

/* NOTIFICATIONS */
window.addEventListener("load", async () => {

  async function enableNotifications() {

  if (!("Notification" in window)) {
    console.log("Notifications non supportées");
    return;
  }

  if (Notification.permission === "default") {
    await Notification.requestPermission();
  }
} 
  enableNotifications();

const saved = localStorage.getItem("lastChat");

if (saved) {
  state.current = JSON.parse(saved);
  document.getElementById("chatHeader").textContent =
    "💬 " + state.current.prenom;

  loadMessages();
}
});


/* LOAD USERS + LAST MSG + BADGE */
async function loadUsers() {

  const { data } = await supabaseClient
    .from("profiles")
    .select("*")
    .neq("user_id", state.user.id);

  const box = document.getElementById("users");
  box.innerHTML = "";

  for (const u of data) {

    const last = await getLastMessage(u.user_id);
    const unread = await getUnreadCount(u.user_id);

    const div = document.createElement("div");
    div.className = "user";

    div.innerHTML = `
      <img src="${u.photo || "https://picsum.photos/50"}">
      <div style="flex:1">
        <div><b>${u.prenom}</b></div>
        <small>${last || "Aucun message"}</small>
      </div>
      ${unread > 0 ? `<div class="badge">${unread}</div>` : ""}
    `;

    div.onclick = () => openChat(u, div);

    box.appendChild(div);
  }
}

/* LAST MESSAGE */
async function getLastMessage(id) {

  const { data } = await supabaseClient
    .from("messages")
    .select("content")
    .or(`
      and(sender_id.eq.${state.user.id},receiver_id.eq.${id}),
      and(sender_id.eq.${id},receiver_id.eq.${state.user.id})
    `)
    .order("created_at", { ascending:false })
    .limit(1)
    .maybeSingle();

  return data?.content || "";
}

/* UNREAD */
async function getUnreadCount(id) {

  const { count } = await supabaseClient
    .from("messages")
    .select("*", { count:"exact", head:true })
    .eq("sender_id", id)
    .eq("receiver_id", state.user.id)
    .eq("is_read", false);

  return count || 0;
}

/* OPEN CHAT */
function openChat(u, el) {

  state.current = u;

  localStorage.setItem("lastChat", JSON.stringify(u)); // 🔥 PERSIST

  document.getElementById("chatHeader").textContent =
    "💬 " + u.prenom;

  document.querySelectorAll(".user")
    .forEach(e => e.classList.remove("active"));

  el.classList.add("active");

  loadMessages();
  markAsRead(u.user_id);
}

/* LOAD MESSAGES */
async function loadMessages() {

  if (!state.current) return;

  const { data, error } = await supabaseClient
    .from("messages")
    .select("*")
    .or(
      `and(sender_id.eq.${state.user.id},receiver_id.eq.${state.current.user_id}),and(sender_id.eq.${state.current.user_id},receiver_id.eq.${state.user.id})`
    )
    .order("created_at", { ascending: true });

  if (error) {
    console.error(error);
    return;
  }

  const box = document.getElementById("messages");
  box.innerHTML = "";

  data.forEach(m => render(m));

  // scroll toujours en bas
  box.scrollTop = box.scrollHeight;
}

/* RENDER MSG */
function render(m) {

  const box = document.getElementById("messages");

 const div = document.createElement("div");
div.className = "msg " + (m.sender_id === state.user.id ? "me" : "them");

// IMPORTANT
div.setAttribute("data-msg-id", m.id);

  if (m.content) {
    const text = document.createElement("div");
    text.textContent = m.content;
    div.appendChild(text);
  }

  if (m.audio) {
    const audio = document.createElement("audio");
    audio.controls = true;
    audio.src = m.audio;
    div.appendChild(audio);
  }

  if (m.reaction) {
    const r = document.createElement("div");
    r.textContent = m.reaction;
    r.style.fontSize = "18px";
    div.appendChild(r);
  }

  if (m.sender_id === state.user.id) {
    const tick = document.createElement("div");
    tick.style.fontSize = "11px";
    tick.textContent = m.is_read ? "✔✔ vu" : "✔ envoyé";
    tick.style.color = m.is_read ? "#4fc3f7" : "#ccc";
    div.appendChild(tick);
  }

if (m.sender_id === state.user.id) {
  const del = document.createElement("div");
  del.textContent = "🗑️ supprimer";
  del.style.cursor = "pointer";
  del.style.fontSize = "11px";
  del.style.opacity = "0.7";

  del.onclick = () => deleteMessage(m.id);

  div.appendChild(del);
}

  box.appendChild(div);
  box.scrollTop = box.scrollHeight;

  // scroll auto
  box.scrollTop = box.scrollHeight;
}

/* REACT */   
async function react(messageId, emoji) {

  await supabaseClient
    .from("messages")
    .update({ reaction: emoji })
    .eq("id", messageId);

  loadMessages();
}

/* SEND */
async function send() {

  const input = document.getElementById("input");
  const text = input.value.trim();

  if (!text || !state.current) return;

  await supabaseClient.from("messages").insert({
    sender_id: state.user.id,
    receiver_id: state.current.user_id,
    content: text,
    is_read: false
  });
  const { data } = await supabaseClient
  .from("profiles")
  .select("premium")
  .eq("user_id", state.user.id)
  .single();

if (!data?.premium) {
  alert("💎 Premium requis");
  return;
}

  input.value = "";
}

/* MARK AS READ */
async function markAsRead(userId) {

  await supabaseClient
    .from("messages")
    .update({ is_read: true })
    .eq("sender_id", userId)
    .eq("receiver_id", state.user.id);
}

/* REALTIME */
function listenMessages() {

  supabaseClient
    .channel("msg")
    .on("postgres_changes", {
      event: "INSERT",
      schema: "public",
      table: "messages"
    }, payload => {

      const m = payload.new;

      // si message actuel ouvert
      if (
        state.current &&
        (
          (m.sender_id === state.current.user_id && m.receiver_id === state.user.id) ||
          (m.sender_id === state.user.id && m.receiver_id === state.current.user_id)
        )
      ) {
        render(m);
      }

      // 🔵 PUSH NOTIF SI PAS DANS CHAT
      if (m.receiver_id === state.user.id) {

        if (!state.current || state.current.user_id !== m.sender_id) {

          showPushNotification(m);
        }
      }

      loadUsers();
    })
    .subscribe();
}
// push notification
function showPushNotification(m) {

  if (Notification.permission !== "granted") return;

  const notif = new Notification("💬 Nouveau message", {
    body: m.content || "Message vocal 🎤",
    icon: "https://cdn-icons-png.flaticon.com/512/2111/2111646.png"
  });

  notif.onclick = async () => {

    window.focus();

    const { data } = await supabaseClient
      .from("profiles")
      .select("*")
      .eq("user_id", m.sender_id)
      .single();

    if (data) {
      openChat(data);
    }
  };
}
/* TYPING */
let typingTimeout;

document.getElementById("input").addEventListener("input", () => {

  sendTyping(true);

  clearTimeout(typingTimeout);

  typingTimeout = setTimeout(() => {
    sendTyping(false);
  }, 1000);
});

async function sendTyping(status) {
  if (!state.current) return;

  await supabaseClient.from("typing").upsert({
    user_id: state.user.id,
    target_id: state.current.user_id,
    is_typing: status,
    updated_at: new Date().toISOString()
  });
}

function listenTyping() {

  supabaseClient
    .channel("typing")
    .on("postgres_changes", {
      event: "*",
      schema: "public",
      table: "typing"
    }, payload => {

      const t = payload.new;

      if (
        state.current &&
        t.user_id === state.current.user_id &&
        t.target_id === state.user.id
      ) {

        const el = document.getElementById("typing");

        el.textContent = t.is_typing ? "✍️ en train d’écrire..." : "";
      }
    })
    .subscribe();
}

setInterval(() => {
  loadUsers();
}, 8000);


// emoji
function toggleEmoji() {
  const panel = document.getElementById("emojiPanel");

  panel.style.display =
    panel.style.display === "none" ? "block" : "none";
}

function addEmoji(emoji) {
  const input = document.getElementById("input");
  input.value += emoji;
  input.focus();
}
document.addEventListener("click", (e) => {
  const panel = document.getElementById("emojiPanel");

  if (!e.target.closest("#emojiPanel") &&
      !e.target.closest("button")) {
    panel.style.display = "none";
  }
});
// delete message
async function deleteMessage(id) {
  const { error } = await supabaseClient
    .from("messages")
    .delete()
    .eq("id", id)
    .eq("sender_id", state.user.id); // 🔒 sécurité

  if (error) {
    console.error(error);
    return;
  }

  // supprime direct du DOM sans reload
  const el = document.querySelector(`[data-msg-id="${id}"]`);
  if (el) el.remove();
}

// premium
async function checkPremium() {

  const { data } = await supabaseClient
    .from("profiles")
    .select("premium")
    .eq("user_id", state.user.id)
    .single();

  if (!data?.premium) {

    document.querySelector(".input").innerHTML = `
      <div style="padding:10px;color:white;text-align:center">
        💎 Chat réservé aux membres Premium<br><br>
        <button onclick="location.href='premium.html'" style="
          padding:10px;
          border:none;
          border-radius:10px;
          background:#ff4d6d;
          color:white;
        ">Devenir Premium</button>
      </div>
    `;

    return false;
  }

  return true;
}
</script>

</body>
</html>
