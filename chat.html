<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Rencontre Amoureuse</title>

<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="favicon.ico">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/core/config.js"></script>
<script src="js/auth.js" defer></script>

<style>
body{
  visibility:hidden;
  margin:0;
  font-family:sans-serif;
}

#profilesGrid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:15px;
  padding:20px;
}

.card{
  background:rgba(255,255,255,0.08);
  border-radius:12px;
  padding:10px;
  cursor:pointer;
}

#chatBox{
  max-width:700px;
  margin:20px auto;
  padding:15px;
  background:rgba(0,0,0,0.05);
  border-radius:12px;
  min-height:350px;
  height:60vh;
  overflow-y:auto;
}

#chatInputBar{
  max-width:700px;
  margin:auto;
  display:flex;
  gap:5px;
}

.msg{
  margin:5px;
  padding:8px;
  border-radius:10px;
  max-width:70%;
  color:white;
}

.me{
  background:#ff4d6d;
  margin-left:auto;
}

.other{
  background:#333;
}
</style>
</head>

<body>

<nav class="header">
  <a href="index.html">🏠 Accueil</a>
  <a href="profile.html">👤 Profil</a>
  <a href="pageDesProfils.html">🔍 Recherche</a>
  <a href="premiumPage.html">💎 Premium</a>
</nav>

<main style="text-align:center;padding:20px;">

<h1>💘 Rencontre</h1>

<div id="profilesGrid"></div>

<h3 id="chatWith">💬 Sélectionne un profil</h3>

<div id="chatBox"></div>

<div id="chatInputBar">
  <input id="msgInput" placeholder="Message..." style="flex:1;padding:10px;">
  <button onclick="sendText()">➤</button>
  <button onclick="startRecording()">🎤</button>
  <button onclick="stopRecording()">⏹</button>
</div>

</main>

<script>
let currentUser;
let currentChatUser = null;
let isPremium = false;
let mediaRecorder;
let audioChunks = [];

/* INIT */
window.addEventListener("DOMContentLoaded", async () => {

  const { data } = await supabaseClient.auth.getUser();
  currentUser = data?.user;

  if(!currentUser){
    location.href="login.html";
    return;
  }

  await loadPremium();
  await loadProfiles();

  initRealtime();

  document.body.style.visibility="visible";
});

/* PREMIUM */
async function loadPremium(){
  const { data } = await supabaseClient
    .from("profiles")
    .select("is_premium")
    .eq("user_id", currentUser.id)
    .maybeSingle();

  isPremium = data?.is_premium || false;
}

/* LOAD PROFILES */
async function loadProfiles(){

  const { data } = await supabaseClient
    .from("profiles")
    .select("user_id, prenom, photo")
    .neq("user_id", currentUser.id);

  const grid = document.getElementById("profilesGrid");
  grid.innerHTML = "";

  data.forEach(p => {

    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <img src="${p.photo || 'https://picsum.photos/200'}" style="width:100%;border-radius:10px;">
      <p>${p.prenom}</p>
    `;

    div.onclick = () => openChat(p);

    grid.appendChild(div);
  });
}

/* OPEN CHAT */
async function openChat(p){

  currentChatUser = p.user_id;

  document.getElementById("chatWith").innerText =
    "💬 Discussion avec " + p.prenom;

  document.getElementById("chatBox").innerHTML = "";

  await loadMessages();
}

/* LOAD MESSAGES */
async function loadMessages(){

  const { data } = await supabaseClient
    .from("messages")
    .select("*")
    .or(`
      and(sender_id.eq.${currentUser.id},receiver_id.eq.${currentChatUser}),
      and(sender_id.eq.${currentChatUser},receiver_id.eq.${currentUser.id})
    `)
    .order("created_at",{ascending:true});

  data.forEach(renderMsg);
  scrollBottom();
}

/* SEND TEXT */
async function sendText(){

  if(!currentChatUser) return;

  if(!isPremium){
    alert("💎 Premium requis");
    return;
  }

  const text = msgInput.value.trim();
  if(!text) return;

  await supabaseClient.from("messages").insert({
    sender_id: currentUser.id,
    receiver_id: currentChatUser,
    content: text
  });

  msgInput.value="";
}

/* REALTIME */
function initRealtime(){

  supabaseClient
    .channel("messages")
    .on("postgres_changes",{
      event:"INSERT",
      schema:"public",
      table:"messages"
    },payload=>{

      const m = payload.new;

      if(
        (m.sender_id === currentUser.id && m.receiver_id === currentChatUser) ||
        (m.sender_id === currentChatUser && m.receiver_id === currentUser.id)
      ){
        renderMsg(m);
        scrollBottom();
      }
    })
    .subscribe();
}

/* RENDER MESSAGE */
function renderMsg(m){

  const div = document.createElement("div");

  div.className =
    "msg " + (m.sender_id === currentUser.id ? "me" : "other");

  if(m.content){
    div.innerText = m.content;
  }

  if(m.audio_url){
    const audio = document.createElement("audio");
    audio.controls = true;
    audio.src = m.audio_url;
    div.appendChild(audio);
  }

  document.getElementById("chatBox").appendChild(div);
}

/* SCROLL */
function scrollBottom(){
  const box = document.getElementById("chatBox");
  box.scrollTop = box.scrollHeight;
}

/* VOICE */
async function startRecording(){

  const stream = await navigator.mediaDevices.getUserMedia({audio:true});

  mediaRecorder = new MediaRecorder(stream);
  audioChunks = [];

  mediaRecorder.ondataavailable = e => audioChunks.push(e.data);

  mediaRecorder.start();
}

function stopRecording(){

  mediaRecorder.stop();

  mediaRecorder.onstop = async () => {

    if(!isPremium){
      alert("💎 Premium requis");
      return;
    }

    const blob = new Blob(audioChunks,{type:"audio/webm"});
    const file = Date.now()+".webm";

    await supabaseClient.storage
      .from("voice-messages")
      .upload(file,blob);

    const { data } = supabaseClient.storage
      .from("voice-messages")
      .getPublicUrl(file);

    await supabaseClient.from("messages").insert({
      sender_id: currentUser.id,
      receiver_id: currentChatUser,
      audio_url: data.publicUrl
    });
  };
}
</script>

</body>
</html>
