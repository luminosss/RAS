<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Recherche profils</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="favicon.ico">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/core/config.js"></script>

  <script src="js/auth.js" defer></script>
  <script type="module" src="js/ui/search-ui.js"></script>

  <style>
    body {
      visibility: hidden;
      margin: 0;
    }
.btn-chat {
  margin-top:10px;
  padding:10px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  background:#4caf50;
  color:white;
  width:100%;
}

.btn-chat.disabled {
  background:gray;
  cursor:not-allowed;
  opacity:0.6;
}
    .container {
      padding: 20px;
    }

    #profilesGrid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }

    .card {
      background: rgba(255,255,255,0.08);
      padding: 10px;
      border-radius: 12px;
      cursor: pointer;
      text-align: center;
    }

    .card img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-radius: 10px;
    }

    .modal {
      display: none; /* 🔥 FIX */
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: rgb(231, 102, 102);
      padding: 20px;
      border-radius: 15px;
      text-align: center;
      max-width: 400px;
      width: 90%;
    }
  </style>
</head>

<body>

<!-- NAV -->
<nav class="header">
  <div class="nav-left">
    <a href="index.html">🏠 Accueil</a>
    <a href="profile.html">👤 Profil</a>
    <a href="pageDesProfils.html">🔍 Recherche</a>
    <a href="signup.html">👤 Inscription</a>
  </div>

  <div class="box">
    <div class="nav-right">
      <button id="authBtn">Connexion</button>
      <span class="online-dot"></span>
    </div>
    <a id="adminLink" href="adminPage.html" style="display:none;">👤 Admin</a>
  </div>
</nav>

<!-- MAIN -->
<main class="container">

  <h1>💘 Recherche de profils</h1>

  <div class="filters">
    <select id="searchAge">
      <option value="">Âge</option>
      <option value="20-25">20-25</option>
      <option value="25-35">25-35</option>
      <option value="35-50">35-50</option>
    </select>

    <button id="searchBtn">🔍 Rechercher</button>
  </div>

  <div id="profilesGrid"></div>

  <!-- PROFILE MODAL -->
  <div id="profileModal" class="modal">
    <div class="modal-content">

      <img id="viewPhoto" width="150" style="border-radius:10px;">
      <h2 id="viewName"></h2>
      <p id="viewInfo"></p>
      <p id="viewBio"></p>

      <button class="btn-chat" onclick="startChat()">💬 Chat</button>
      <button onclick="closeModal()">❌ Close</button>

    </div>
  </div>


  <!-- CHAT POPUP -->
<div id="chatPopup" class="modal">
  <div class="modal-content" style="max-width:500px;">

    <h3 id="chatTitle">💬 Chat</h3>

    <div id="chatMessages" style="
      height:300px;
      overflow-y:auto;
      margin:10px 0;
      text-align:left;
    "></div>

    <input id="chatInput" placeholder="Message..." style="width:100%;padding:10px;">

    <button onclick="sendPopupMsg()">Envoyer</button>
    <button onclick="closeChatPopup()">Fermer</button>

  </div>
</div>
</main>

<script>
const state = {
  user: null,
  selected: null
};

let chatTarget = null;

/* ================= INIT ================= */
document.addEventListener("DOMContentLoaded", async () => {
  const { data } = await supabaseClient.auth.getUser();

  if (!data?.user) {
    window.location.href = "login.html";
    return;
  }

  state.user = data.user;

  setOnline(true);
  await loadProfiles();

  document.body.style.visibility = "visible";
});

/* ================= ONLINE ================= */
async function setOnline(status) {
  if (!state.user) return;

  await supabaseClient
    .from("profiles")
    .update({
      online: status,
      last_seen: new Date().toISOString()
    })
    .eq("user_id", state.user.id);
}

window.addEventListener("beforeunload", () => setOnline(false));

/* ================= PROFILES ================= */
async function loadProfiles() {
  const { data } = await supabaseClient
    .from("profiles")
    .select("*")
    .neq("user_id", state.user.id);

  const grid = document.getElementById("profilesGrid");
  if (!grid) return;

  grid.innerHTML = "";

  (data || []).forEach(p => {
    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <img src="${p.photo || 'https://picsum.photos/200'}">
      <h3>${p.prenom || ""}</h3>
      <p>${p.age || "?"} ans • ${p.ville || ""}</p>
    `;

    div.onclick = () => openProfile(p);
    grid.appendChild(div);
  });
}

/* ================= PROFILE ================= */
function openProfile(p) {
  state.selected = p;

  document.getElementById("profileModal").style.display = "flex";

  document.getElementById("viewPhoto").src = p.photo || "https://picsum.photos/200";
  document.getElementById("viewName").textContent = p.prenom || "";
  document.getElementById("viewInfo").textContent = `${p.age || "?"} ans • ${p.ville || ""}`;
  document.getElementById("viewBio").textContent = p.bio || "";
}

function closeModal() {
  document.getElementById("profileModal").style.display = "none";
}

/* ================= CHAT DIRECT ================= */
function startChat() {
  if (!state.selected) return;

  openChatPopup(state.selected);
}

/* ================= CHAT POPUP ================= */
function openChatPopup(user) {
  chatTarget = user;

  document.getElementById("chatPopup").style.display = "flex";
  document.getElementById("chatTitle").textContent = "💬 " + user.prenom;

  loadMessages();
}

/* ================= CLOSE ================= */
function closeChatPopup() {
  document.getElementById("chatPopup").style.display = "none";
}

/* ================= LOAD MESSAGES ================= */
async function loadMessages() {
  const box = document.getElementById("chatMessages");
  if (!box || !chatTarget) return;

  const { data } = await supabaseClient
    .from("messages")
    .select("*")
    .or(`
      and(sender_id.eq.${state.user.id},receiver_id.eq.${chatTarget.user_id}),
      and(sender_id.eq.${chatTarget.user_id},receiver_id.eq.${state.user.id})
    `)
    .order("created_at");

  box.innerHTML = "";

  (data || []).forEach(renderMsg);
}

/* ================= RENDER ================= */
function renderMsg(m) {
  const box = document.getElementById("chatMessages");
  if (!box) return;

  const div = document.createElement("div");

  div.style.padding = "8px";
  div.style.margin = "5px";
  div.style.borderRadius = "10px";
  div.style.maxWidth = "70%";
  div.style.color = "white";

  div.style.background =
    m.sender_id === state.user.id ? "#ff4d6d" : "#333";

  div.style.marginLeft =
    m.sender_id === state.user.id ? "auto" : "0";

  div.textContent = m.content;

  box.appendChild(div);
}

/* ================= SEND ================= */
async function sendPopupMsg() {
  const input = document.getElementById("chatInput");
  if (!input || !chatTarget) return;

  const text = input.value.trim();
  if (!text) return;

  await supabaseClient.from("messages").insert({
    sender_id: state.user.id,
    receiver_id: chatTarget.user_id,
    content: text
  });

  input.value = "";
}

/* ================= BUTTON ================= */
document.getElementById("searchBtn")?.addEventListener("click", loadProfiles);
</script>

</body>
</html>
