<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>App Profils</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/core/config.js"></script>

<style>
body {
  font-family: 'Segoe UI', sans-serif;
  color: white;

  min-height: 200vh;

  display: flex;
  flex-direction: column;
  align-items: center;

  background: linear-gradient(-45deg, #ff4d6d, #7b2ff7, #00c6ff);
  background-size: 400% 400%;
  animation: bg 12s ease infinite;
}

@keyframes bg {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

.header {
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;

  gap: 12px;
  padding: 15px;

  background: rgba(0,0,0,0.2);
  backdrop-filter: blur(12px);
}

.header a {
  color: white;
  text-decoration: none;
  padding: 8px 12px;
  border-radius: 10px;
  transition: 0.2s;
}

.header a:hover {
  background: rgba(255,255,255,0.2);
}
/* ================= PROFILES GRID ================= */
.container{
  padding:15px;
}

#profilesGrid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:15px;
}

.card{
  background:#1a1a1a;
  border-radius:15px;
  overflow:hidden;
  cursor:pointer;
  transition:0.2s;
}

.card:hover{
  transform:scale(1.03);
}

.card img{
  width:100%;
  height:180px;
  object-fit:cover;
}

.card .info{
  padding:10px;
}

/* ================= MODAL CENTRÉ ================= */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.7);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:999;
}

.modal-content{
  width:90%;
  max-width:420px;
  background:#181818;
  border-radius:20px;
  overflow:hidden;
  animation:zoom 0.25s ease;
}

@keyframes zoom{
  from{transform:scale(0.8);opacity:0}
  to{transform:scale(1);opacity:1}
}

/* ================= PROFILE HEADER ================= */
.profile-header img{
  width:100%;
  height:220px;
  object-fit:cover;
}

.profile-body{
  padding:15px;
}

/* STORY STYLE IMAGES */
.story-row{
  display:flex;
  gap:8px;
  padding:10px;
  overflow-x:auto;
}

.story-row img{
  width:60px;
  height:60px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid #ff4d6d;
  cursor:pointer;
}

/* BUTTONS */
.btn{
  width:100%;
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  cursor:pointer;
}

.chat-btn{
  background:#ff4d6d;
  color:white;
}

.close-btn{
  background:#333;
  color:white;
}

/* IMAGE VIEW */
.image-view{
  position:fixed;
  inset:0;
  background:black;
  display:none;
  justify-content:center;
  align-items:center;
  z-index:1000;
}

.image-view img{
  max-width:90%;
  max-height:90%;
}
</style>
</head>

<body>

<!-- NAV -->
<nav class="header">
  <div class="nav-left">
    <a href="index.html">🏠 Accueil</a>
    <a href="profile.html">👤 Profil</a>
    <a href="pageDesProfils.html">🔍 Recherche</a>
    <a href="signup.html">👤 Inscription</a>
  </div>
</nav>

<div class="container">

<h2>🔥Ceci est la page des profils</h2>
<hr>
<br>
<div id="profilesGrid"></div>
</div>

<!-- ================= MODAL ================= -->
<div class="modal" id="modal">
  <div class="modal-content">

    <div class="profile-header">
      <img id="modalPhoto">
    </div>

    <div class="story-row" id="storyRow"></div>

    <div class="profile-body">
      <h2 id="modalName"></h2>
      <p id="modalInfo"></p>
      <p id="modalBio"></p>

      <button class="btn chat-btn" onclick="openChat()">💬 Chat</button>
      <button class="btn close-btn" onclick="closeModal()">Fermer</button>
    </div>

  </div>
</div>

<!-- IMAGE ZOOM -->
<div class="image-view" id="imageView" onclick="this.style.display='none'">
  <img id="bigImg">
</div>

<script>

let currentUser = null;
let selected = null;

/* LOAD */
document.addEventListener("DOMContentLoaded", async () => {

  const { data } = await supabaseClient.auth.getUser();
  if (!data?.user) return location.href = "login.html";

  currentUser = data.user;

  loadProfiles();
});

/* LOAD PROFILES */
async function loadProfiles(){

  const { data } = await supabaseClient
    .from("profiles")
    .select("*")
    .neq("user_id", currentUser.id);

  const box = document.getElementById("profilesGrid");
  box.innerHTML = "";

  data.forEach(p => {

    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <img src="${p.photo || 'https://picsum.photos/300'}">
      <div class="info">
        <strong>${p.prenom}</strong>
        <p>${p.age} ans</p>
      </div>
    `;

    div.onclick = () => openProfile(p);

    box.appendChild(div);
  });
}

/* OPEN PROFILE */
function openProfile(p){

  selected = p;

  document.getElementById("modal").style.display = "flex";

  document.getElementById("modalPhoto").src =
    p.photo || "https://picsum.photos/400";

  document.getElementById("modalName").textContent =
    p.prenom;

  document.getElementById("modalInfo").textContent =
    `${p.age} ans • ${p.ville}`;

  document.getElementById("modalBio").textContent =
    p.bio || "";

  loadStories(p);
}

/* STORIES MULTI IMAGES */
function loadStories(p){

  const row = document.getElementById("storyRow");
  row.innerHTML = "";

  let images = [];

  try{
    images = JSON.parse(p.photos || "[]");
  }catch(e){}

  if(!images.length){
    images = [p.photo];
  }

  images.forEach(img => {

    const el = document.createElement("img");
    el.src = img;

    el.onclick = () => openImage(img);

    row.appendChild(el);
  });
}

/* IMAGE FULL SCREEN */
function openImage(src){
  document.getElementById("bigImg").src = src;
  document.getElementById("imageView").style.display = "flex";
}

/* CLOSE MODAL */
function closeModal(){
  document.getElementById("modal").style.display = "none";
}

/* CHAT SIMPLE */
function openChat(){
  window.location.href = "chat.html";
}

</script>

</body>
</html>
