<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Création profil</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="favicon.ico">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/core/config.js"></script>

  <script src="js/core/session.js" defer></script>
  <script src="js/auth.js"></script>

  <style>
    body {
      visibility: hidden;
      margin: 0;
    }

    .profile-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 90vh;
      padding: 20px;
    }

    .profile-card {
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(12px);
      padding: 30px;
      border-radius: 20px;
      width: 95%;
      max-width: 520px;
      text-align: center;
    }

    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
    }

    input, textarea, select {
      width: 100%;
      margin: 8px 0;
      padding: 10px;
      border-radius: 10px;
      border: none;
      outline: none;
    }

    .progress {
      width: 100%;
      height: 8px;
      background: rgba(255,255,255,0.2);
      border-radius: 10px;
      margin: 10px 0;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ff4d6d, #ffb703);
      transition: 0.3s;
    }

    .save-status {
      font-size: 12px;
      opacity: 0.7;
      margin-top: 5px;
    }
  </style>
</head>

<body>

<nav class="header">
  <div class="nav-left">
    <a href="index.html">🏠 Accueil</a>
    <a href="profile.html">👤 Profil</a>
    <a href="pageDesProfils.html">🔍 Recherche</a>
    <a href="signup.html">👤 Inscription</a>
  </div>
</nav>

<div class="profile-wrapper">
  <div class="profile-card">

    <h1>💘 Mon profil</h1>

    <div class="progress">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <img id="createPhoto" src="https://picsum.photos/120" class="avatar">
    <input type="file" id="photoInput">

    <input id="prenom" placeholder="Prénom">
    <input id="nom" placeholder="Nom">
    <input id="age" type="number" placeholder="Âge">
    <input id="ville" placeholder="Ville">

    <textarea id="bio" placeholder="Bio"></textarea>

    <select id="lookingFor">
      <option value="">Je cherche...</option>
      <option value="amour">❤️ Amour</option>
      <option value="amitié">😊 Amitié</option>
      <option value="fun">🔥 Fun</option>
    </select>

    <button id="saveBtn">💾 Sauvegarder</button>
    <div class="save-status" id="saveStatus"></div>

  </div>
</div>

<hr>

<h3>👀 Aperçu</h3>

<div id="previewCard">
  <img id="previewPhoto" src="https://picsum.photos/120">
  <h3 id="previewName">Prénom Nom</h3>
  <p id="previewInfo">Âge • Ville</p>
  <p id="previewBio">Bio...</p>
  <p id="previewLooking">💘 Recherche...</p>
</div>

<script>
const el = id => document.getElementById(id);

let saveTimeout = null;
let isSaving = false;
let lastProfile = "";

/* EVENTS */
["prenom","nom","age","ville","bio","lookingFor"].forEach(id => {
  el(id).addEventListener("input", handleInput);
});

el("photoInput").addEventListener("change", previewPhoto);
el("saveBtn").addEventListener("click", manualSaveProfile);

/* INPUT */
function handleInput() {
  updatePreview();
  updateProgress();
  triggerAutoSave();
}

/* SAVE MANUEL */
async function manualSaveProfile() {
  await saveProfile(true);
}

/* AUTO SAVE */
function triggerAutoSave() {
  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(() => saveProfile(false), 800);
}

async function saveProfile(showAlert = false) {
  if (isSaving) return;

  try {
    isSaving = true;
    el("saveStatus").textContent = "⏳ Sauvegarde...";

    const { data } = await supabaseClient.auth.getUser();
    if (!data?.user) return;

    const ageValue = parseInt(el("age").value);

    const profile = {
      user_id: data.user.id,
      prenom: el("prenom").value || "",
      nom: el("nom").value || "",
      age: isNaN(ageValue) ? null : Math.min(Math.max(ageValue, 18), 100),
      ville: el("ville").value || "",
      bio: el("bio").value || "",
      looking_for: el("lookingFor").value || "",
      photo: el("createPhoto").src
    };

    const current = JSON.stringify(profile);
    if (current === lastProfile) return;
    lastProfile = current;

    const { error } = await supabaseClient
      .from("profiles")
      .upsert(profile, { onConflict: "user_id" });

    if (error) throw error;

    el("saveStatus").textContent = "✔ Sauvegardé";

    if (showAlert) alert("✔ Profil sauvegardé");

  } catch (err) {
    console.error(err);
    el("saveStatus").textContent = "❌ Erreur sauvegarde";
  } finally {
    isSaving = false;
  }
}

/* PHOTO */
function previewPhoto(e) {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = ev => {
    el("createPhoto").src = ev.target.result;
    handleInput();
  };
  reader.readAsDataURL(file);
}

/* PROGRESS */
function updateProgress() {
  const fields = ["prenom","nom","age","ville","bio","lookingFor"];
  const filled = fields.filter(id => el(id).value.trim() !== "").length;
  el("progressBar").style.width = (filled / fields.length * 100) + "%";
}

/* PREVIEW */
function updatePreview() {
  el("previewName").textContent =
    `${el("prenom").value || "Prénom"} ${el("nom").value || "Nom"}`;

  el("previewInfo").textContent =
    `${el("age").value || "?"} ans • ${el("ville").value || "Ville"}`;

  el("previewBio").textContent =
    el("bio").value || "Bio...";

  el("previewLooking").textContent =
    el("lookingFor").value
      ? "💘 " + el("lookingFor").value
      : "💘 Recherche...";

  el("previewPhoto").src = el("createPhoto").src;
}

/* LOAD */
window.addEventListener("DOMContentLoaded", async () => {
  const { data } = await supabaseClient.auth.getUser();
  if (!data?.user) return location.href = "login.html";

  const { data: profile } = await supabaseClient
    .from("profiles")
    .select("*")
    .eq("user_id", data.user.id)
    .maybeSingle();

  if (profile) {
    el("prenom").value = profile.prenom || "";
    el("nom").value = profile.nom || "";
    el("age").value = profile.age || "";
    el("ville").value = profile.ville || "";
    el("bio").value = profile.bio || "";
    el("lookingFor").value = profile.looking_for || "";
    el("createPhoto").src = profile.photo || el("createPhoto").src;
  }

  updatePreview();
  updateProgress();
  document.body.style.visibility = "visible";
});
</script>

</body>
</html>
